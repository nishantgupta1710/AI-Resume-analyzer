<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create job</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
      body{
        background:linear-gradient(
          135deg,
          #0f172a,
          #1e293b,
          #2563eb

        );
        min-height: 100vh;
      }
      .job-card{
        background: rgba(255,255,255,.08);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 25px;
        padding: 35px;
        color: white;
        box-shadow: 0 15px 40px rgba(255,255,255,.35);
      }
      .form-control{
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        color: white;
      }
      .form-control::placeholder{
        color:#d1d5db;

      }
      .form-control:focus{
        background: rgba(255,255,255,.12);
        color: white;
        border-color: #3b82f6;
        box-shadow:none
      }
      .btn-primary{
        border-radius: 12px;
        font-weight: bold;
        padding: 12px;
      }
     </style>
</head>


<body>
    <div class="container py-5">
        <div class="job-card">
        
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Post New Job</h2>

        <form method="POST">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
                <label>Job title</label>         

          <input type="text" name ='title' class="form-control mb-3" placeholder="Title">
          </div>
          <div class="col-md-6 mb-3">
          <label>Company Name</label>
          <input type="text" name ='company_name' class="form-control mb-3" placeholder="Company Name">
          </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
                <label>Location</label>
          <input type="text" name ='location' class="form-control mb-3" placeholder="Location">
            </div>
            <div class="col-md-6 mb-3">
                <label>Salary</label>
          <input type="text" name ='salary' class="form-control mb-3" placeholder="Salary">
            </div>
          </div>
          <div class="mb-3">
            <label>Required Skills</label>
          <textarea name="skills_required" class="form-control mb-3" placeholder="Required Skills"></textarea>
          </div>
          <div class="mb-3">
            <label>Job description</label>
          <textarea name="description" class="form-control mb-3" placeholder="Job description"></textarea>
          </div>

          <button class="btn btn-primary w-100">Post Job</button>


        </form>
    </div>
    </div>
    
    </div>
</body>
</html>
