<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#2563eb
);

min-height:100vh;

padding:40px;

}

.feedback-card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:22px;

padding:35px;

color:white;

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.feedback-card h2{

font-weight:bold;

margin-bottom:10px;

}

.info-box{

background:rgba(255,255,255,.05);

border-radius:15px;

padding:18px;

margin-bottom:25px;

}

.result-box{

background:rgba(255,255,255,.05);

border-left:5px solid #3b82f6;

border-radius:15px;

padding:20px;

white-space:pre-wrap;

}

.btn{

border-radius:12px;

font-weight:bold;

padding:10px 18px;

}

</style>

</head>

<body>

<div class="container">

<div class="feedback-card">

<h2>

🤖 AI Candidate Feedback

</h2>

<p class="text-secondary">

AI generated analysis for recruiter

</p>

<div class="info-box">

<h5>

👤 Candidate

</h5>

<p>

{{ application.user.username }}

</p>

<h5>

💼 Applied For

</h5>

<p>

{{ application.job.title }}

</p>

<h5>

📊 Resume Score

</h5>

<p>

{{ score }}%

</p>

</div>

<div class="result-box">

<h4>

📄 AI Feedback

</h4>

<hr>
<pre style="
color:white;
background:none;
border:none;
white-space:pre-wrap;
margin:0;
font-family:inherit;
">

{{ feedback }}

</pre>

</div>

<div class="d-flex justify-content-between mt-4">

<a
href="{% url 'view_applications' application.job.id %}"
class="btn btn-outline-light">

⬅️ Back to Applications

</a>

<a
href="{% url 'add_feedback' application.id %}"
class="btn btn-primary">

✍️ Add Recruiter Feedback

</a>

</div>

</div>

</div>

</body>
</html>
