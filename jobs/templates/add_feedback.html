<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.feedback-card{

    width:750px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:22px;

    padding:40px;

    color:white;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.feedback-card h2{

    text-align:center;

    margin-bottom:30px;

    font-weight:bold;

}

.form-control{

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    color:white;

}

.form-control:focus{

    background:rgba(255,255,255,.12);

    color:white;

    border-color:#3b82f6;

    box-shadow:none;

}

.form-control::placeholder{

    color:#d1d5db;

}

.btn{

    border-radius:12px;

    font-weight:bold;

    padding:12px;

}

</style>

</head>

<body>

<div class="feedback-card">

<h2>

📝 Add Recruiter Feedback

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-4">

<label class="mb-2">

Feedback

</label>

<textarea

name="feedback"

rows="8"

class="form-control"

placeholder="Write professional feedback for the candidate..."></textarea>

</div>
<button
type="submit"
class="btn btn-primary w-100">

💾 Save Feedback

</button>

</form>

<div class="text-center mt-4">

<a
href="javascript:history.back()"
class="btn btn-outline-light">

⬅️ Back

</a>

</div>

</div>

</body>

</html>
