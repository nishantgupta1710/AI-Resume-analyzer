<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

body{
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:35px;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.form-control{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:white;
}

.form-control::placeholder{
    color:#d1d5db;
}

.form-control:focus{
    background:rgba(255,255,255,.12);
    color:white;
    border-color:#3b82f6;
    box-shadow:none;
}

.btn{
    border-radius:12px;
    font-weight:bold;
    padding:12px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

a:hover{
    color:white;
}

</style>
</head>

<body>
  <div class="container">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="login-card">

<h2 class="text-center mb-4">
🔐 Login
</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password">

</div>

<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

<p class="text-center mt-4">

Don't have an account?

<a href="{% url 'signup' %}">

Create Account

</a>

</p>

</form>

</div>

</div>

</div>

</div>
    
</body>
</html>
