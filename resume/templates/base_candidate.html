<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Candidate{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

body{
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    min-height:100vh;
    margin:0;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:rgba(15,23,42,.85);
    backdrop-filter:blur(20px);
    padding:20px;
}

.sidebar h3{
    color:white;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    transition:.3s;
}

.sidebar a:hover{
    background:#1e293b;
}

.sidebar .active{
    background:#2563eb;
}

.main-content{
    margin-left:250px;
    padding:30px;
    width:calc(100% - 250px);
}

    </style>

</head>

<body>

<div class="sidebar">

<h3>🚀 AI Resume</h3>

<a href="{% url 'dashboard' %}" class="{% block dashboard_active %}{% endblock %}">
🏠 Dashboard
</a>

<a href="{% url 'upload_resume' %}" class="{% block upload_active %}{% endblock %}">
📄 Upload Resume
</a>

<a href="{% url 'job_list' %}" class="{% block jobs_active %}{% endblock %}">
💼 View Jobs
</a>

<a href="{% url 'my_applications' %}" class="{% block applications_active %}{% endblock %}">
📑 My Applications
</a>

<a href="{% url 'mock_interview' %}" class="{% block interview_active %}{% endblock %}">
🎤 Mock Interview
</a>

<a href="{% url 'career_chatboat' %}" class="{% block career_active %}{% endblock %}">
🤖 Career Assistant
</a>

<a href="{% url 'cover_letter' %}" class="{% block cover_active %}{% endblock %}">
📝 Cover Letter
</a>

<a href="{% url 'profile' %}">
    👤 Profile
</a>

<a href="/logout/">
🚪 Logout
</a>

</div>

<div class="main-content">

{% block content %}

{% endblock %}

</div>

</body>
</html>
