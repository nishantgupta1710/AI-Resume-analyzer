{% extends "base_recruiter.html" %}

{% block title %}
Edit Recruiter Profile
{% endblock %}

{% block content %}

<style>

.profile-card {
    max-width: 1000px;
    margin: 30px auto;
    padding: 35px;
    border-radius: 25px;

    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
}

.profile-title {
    color: white;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
}

.profile-subtitle {
    color: #cbd5e1;
    margin-bottom: 30px;
}

.form-label {
    color: white;
    font-weight: 600;
}

.form-control {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    color: white;
    border-radius: 12px;
    padding: 12px;
}

.form-control:focus {
    background: rgba(255,255,255,0.15);
    color: white;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
}

.form-control::placeholder {
    color: #cbd5e1;
}

textarea.form-control {
    min-height: 130px;
}

.save-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 30px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
    );

    color: white;
    font-weight: 600;
}

.cancel-btn {
    border-radius: 12px;
    padding: 13px 25px;
    margin-left: 10px;
}

</style>


<div class="profile-card">

    <div class="profile-title">
        👤 Edit Recruiter Profile
    </div>

    <div class="profile-subtitle">
        Update your company and recruiter information.
    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="row g-4">

            <div class="col-md-6">

                <label class="form-label">
                    🏢 Company Name
                </label>

                <input
                    type="text"
                    name="company_name"
                    class="form-control"
                    placeholder="Enter company name"
                    value="{{ profile.company_name }}"
                    required
                >

            </div>


            <div class="col-md-6">

                <label class="form-label">
                    👤 HR Name
                </label>

                <input
                    type="text"
                    name="hr_name"
                    class="form-control"
                    placeholder="Enter HR name"
                    value="{{ profile.hr_name }}"
                    required
                >

            </div>


            <div class="col-md-6">

                <label class="form-label">
                    📞 Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    value="{{ profile.phone }}"
                    required
                >

            </div>


            <div class="col-md-6">

                <label class="form-label">
                    📍 Location
                </label>

                <input
                    type="text"
                    name="location"
                    class="form-control"
                    placeholder="Enter company location"
                    value="{{ profile.location }}"
                    required
                >

            </div>


            <div class="col-12">

                <label class="form-label">
                    🌐 Website
                </label>

                <input
                    type="url"
                    name="website"
                    class="form-control"
                    placeholder="https://example.com"
                    value="{{ profile.website }}"
                >

            </div>


            <div class="col-12">

                <label class="form-label">
                    🏢 About Company
                </label>

                <textarea
                    name="about_company"
                    class="form-control"
                    placeholder="Tell candidates about your company..."
                >{{ profile.about_company }}</textarea>

            </div>

        </div>


        <div class="mt-4">

            <button type="submit" class="save-btn">
                💾 Save Profile
            </button>

            <a
                href="{% url 'recruiter_profile' %}"
                class="btn btn-secondary cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
