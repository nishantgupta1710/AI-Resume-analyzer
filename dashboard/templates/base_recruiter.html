<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#2563eb
);
min-height:100vh;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:rgba(15,23,42,.85);
backdrop-filter:blur(20px);
padding:20px;
}

.sidebar h3{
color:white;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.sidebar a:hover{
background:#1e293b;
}

.sidebar .active{
background:#2563eb;
}

.main-content{
margin-left:250px;
padding:30px;
width: calc(100% - 250px);
}

</style>

</head>

<body>

<div class="sidebar">

<h3>🏢 Recruiter</h3>

<a href="{% url 'recruiter_dashboard' %}"
class="{% if active_page == 'dashboard' %}active{% endif %}">
🏠 Dashboard
</a>

<a href="{% url 'manage_jobs' %}"
class="{% if active_page == 'manage_jobs' %}active{% endif %}">
💼 Manage Jobs
</a>
<a href="/jobs/create/">➕ Post Job</a>

<a href="{% url 'recruiter_applications' %}"
class="{% if active_page == 'applications' %}active{% endif %}">
📄 Applications
</a>

<a href="{% url 'analytics' %}"
class="{% if active_page == 'analytics' %}active{% endif %}">
📊 Analytics
</a>
<a href="{% url 'recruiter_profile' %}"> 👤 Profile</a>

<a href="/logout/">🚪 Logout</a>

</div>

<div class="main-content">

{% block content %}

{% endblock %}

</div>

</body>

</html>
